name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs matter here beyond convenience: `update-snapshots.yml` commits
  # e2e/snapshots/ci/** with the default GITHUB_TOKEN, and a push made with
  # that token does not trigger other workflows. After generating or
  # refreshing the CI baselines, start this workflow by hand (Actions -> CI ->
  # Run workflow) on the same branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: tools/ci.sh
    runs-on: ubuntu-latest
    # The pipeline ends with the Playwright suite against the built demos.
    timeout-minutes: 60

    env:
      # Screenshot baselines are committed per environment
      # (e2e/lib/snapshot-tag.ts). On a runner the comparable set is
      # e2e/snapshots/ci/, generated by .github/workflows/update-snapshots.yml.
      # Until that workflow has run once the directory does not exist and
      # themes.spec.ts skips only the 105 screenshot comparisons, printing the
      # command to generate them; the chart-colour and contrast sweeps run
      # either way.
      SNAPSHOT_TAG: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # gen-schema diff -> elm make -> package docs -> elm-review -> elm-test
      # -> render audit -> should-not-compile -> gen-cally-css -> demo build
      # (which also generates dist/docs/) -> css-coverage -> Playwright.
      # Any failure stops the pipeline.
      - name: Run the full pipeline
        run: bash tools/ci.sh

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
